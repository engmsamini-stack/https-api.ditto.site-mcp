<text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle" letter-spacing="1" stroke="none">N</text>
</g>
<circle cx="240" cy="175" r="96" fill="none" stroke="#BFE3F0" stroke-opacity="0.12" stroke-dasharray="3 6"/>

