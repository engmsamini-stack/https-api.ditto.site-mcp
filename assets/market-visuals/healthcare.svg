<text x="40" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#BFE3F0" fill-opacity="0.5">SCOPE: ARCH · MEP · CIVIL · STRUCT</text>
